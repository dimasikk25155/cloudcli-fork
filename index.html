<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Neo3 Agent System</title>

    <!-- Шрифты. Гарнитура — самый сильный различитель темы, сильнее палитры:
         пока весь интерфейс набирался одной, темы читались как одна и та же
         в разной покраске.
           Geologica      → ember («Оранжевая»: тёплый техно-гротеск)
           системный      → codex («Графит») и claudeLight («Светлая Claude»)
           Source Serif 4 → claudeLight (засечные заголовки, SIL OFL, с кириллицей)
           Outfit         → glass («Бирюзовая»: мягкая геометрия)
           JetBrains Mono → neon («Неон»: моноширинный интерфейс) и код во всех темах
           Encode Sans    → neon (переписка и список чатов: длинный текст — гротеском)
           General Sans + IBM Plex Mono → bio (лежат в самом Neo3: public/fonts,
             @font-face в src/index.css; без внешних запросов)
         Merriweather, Barlow и Work Sans больше не шрифт ни одной темы, но
         остаются в выборе «Тонкая настройка темы» (FONT_STACKS в
         src/utils/themeTweaks.ts) — список там обязан совпадать с загруженным. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neo3 Agent" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Тема до первой отрисовки. Без этого страница рисуется без data-theme
         и класса dark, пока не загрузится бандл, и светлая тема мигает тёмным
         (а тёмная — светлым). Здесь же подменяется убранная тема: id, которого
         больше нет, дал бы страницу без оформления до монтирования React.
         Списки ниже — копии из src/contexts (THEMES и LIGHT_THEMES в
         ThemeContext.jsx, LEGACY_THEME_MAP и NEON_VARIANTS в themeMigration.js):
         скрипт до отрисовки импортировать модуль не может. Совпадение копий
         проверяют theme-registry.test.ts и themeMigration.test.ts.
         Цвет фона — тот, что ThemeContext сохранил из токена темы. -->
    <script>
      (function () {
        var THEMES = ['ember', 'codex', 'bio', 'neon', 'glass', 'claudeLight'];
        var LIGHT_THEMES = ['glass', 'claudeLight'];
        var NEON_VARIANTS = ['city', 'synthwave', 'nebula', 'mission', 'bento', 'chrome', 'zen', 'kinetic'];
        var LEGACY_THEME_MAP = {
          neonCity: ['neon', 'city'],
          synthwaveDrive: ['neon', 'synthwave'],
          nebulaFlow: ['neon', 'nebula'],
          missionControl: ['neon', 'mission'],
          bento3d: ['neon', 'bento'],
          liquidChrome: ['neon', 'chrome'],
          zenParticles: ['neon', 'zen'],
          kineticType: ['neon', 'kinetic'],
          gt: ['ember'],
          claude: ['ember'],
          editorial: ['glass']
        };
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem('appTheme') || localStorage.getItem('shaderVariant');
          var theme = saved || 'ember';
          var variant = localStorage.getItem('neonVariant');
          var color = localStorage.getItem('appThemeColor');
          if (THEMES.indexOf(theme) === -1) {
            // Убранная тема → ближайшая живая; всё неизвестное → оранжевая.
            var legacy = Object.prototype.hasOwnProperty.call(LEGACY_THEME_MAP, theme)
              ? LEGACY_THEME_MAP[theme]
              : ['ember'];
            theme = legacy[0];
            if (legacy[1]) {
              variant = legacy[1];
              localStorage.setItem('neonVariant', variant);
            }
            localStorage.setItem('appTheme', theme);
            // Сохранённый цвет окна принадлежал прежней теме.
            localStorage.removeItem('appThemeColor');
            color = null;
          }
          var dark = LIGHT_THEMES.indexOf(theme) === -1;
          root.setAttribute('data-theme', theme);
          if (theme === 'neon') {
            root.setAttribute('data-theme-variant', NEON_VARIANTS.indexOf(variant) === -1 ? 'city' : variant);
          } else {
            root.removeAttribute('data-theme-variant');
          }
          root.classList.toggle('dark', dark);
          if (!/^#[0-9a-f]{6}$/i.test(color || '')) {
            color = dark ? '#141414' : '#faf9f5';
          }
          root.style.backgroundColor = color;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', color);
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute('content', dark ? 'black-translucent' : 'default');
        } catch (error) {
          // Нет доступа к localStorage (приватный режим) — тему поставит приложение.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>

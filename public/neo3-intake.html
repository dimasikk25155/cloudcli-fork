<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Анкета</title><style>body{font:17px system-ui;max-width:660px;margin:40px auto;padding:20px;background:#fafafa;color:#18181b}input,textarea,select,button{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box}input,textarea,select{width:100%}button{cursor:pointer}#error{color:#b91c1c}#history p{white-space:pre-wrap}label{display:block}button:disabled{opacity:.5}</style></head><body><h1 id="title">Анкета</h1><p>Ответы сохраняются на сервере. Продолжить можно в этом браузере в течение 7 дней. Не передавайте ссылку сессии другим людям.</p><div id="history"></div><p id="progress" role="status"></p><p id="error" role="alert"></p><form id="form"><label id="question" for="answer"></label><div id="input"></div><button id="send" type="submit">Ответить</button> <button id="skip" type="button">Пропустить</button></form><button id="retry" hidden>Продолжить</button><button id="restart" hidden>Начать новую анкету</button><script>
'use strict';
const formToken=location.hash.slice(1),key='neo3-intake:'+formToken;
let sessionToken='',state=null,busy=false;
const el=id=>document.getElementById(id);
function storageRead(){try{return localStorage.getItem(key)||'';}catch{return '';}}
function storageWrite(value){try{localStorage.setItem(key,value);}catch{el('error').textContent='Браузер запрещает сохранение: после закрытия страницы продолжить не получится.';}}
async function call(path,body){const r=await fetch('/api/public-intake/'+path,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось сохранить ответ');return data;}
function render(){el('title').textContent=state.title;el('history').replaceChildren();for(const [name,value] of Object.entries(state.answers)){const p=document.createElement('p');p.textContent=name+': '+(value===null?'Пропущено':String(value));el('history').append(p);}el('progress').textContent=state.complete?'Спасибо! Бриф сохранён.':'Вопрос '+(state.step+1)+' из '+state.total;el('form').hidden=state.complete;el('restart').hidden=!state.complete;if(state.complete)return;const f=state.question;el('question').textContent=f.label+(f.required?' *':'');el('input').replaceChildren();let input=document.createElement(f.type==='choice'?'select':f.type==='text'?'textarea':'input');input.id='answer';if(f.type==='choice'){for(const c of f.choices){const option=document.createElement('option');option.value=c;option.textContent=c;input.append(option);}}else if(f.type!=='text')input.type=f.type==='number'?'number':'email';input.required=f.required;input.maxLength=4000;el('input').append(input);el('skip').hidden=f.required;input.focus();}
async function run(fn){if(busy)return;busy=true;el('send').disabled=true;el('skip').disabled=true;el('error').textContent='';el('retry').hidden=true;try{await fn();render();}catch(e){el('error').textContent=e.message;el('retry').hidden=false;el('restart').hidden=false;}finally{busy=false;el('send').disabled=false;el('skip').disabled=false;}}
async function load(){if(!/^[-\w]{43}$/.test(formToken))throw new Error('Некорректная ссылка анкеты');sessionToken=storageRead();if(sessionToken){state=await call('resume',{sessionToken});}else{const result=await call('start',{formToken});sessionToken=result.sessionToken;storageWrite(sessionToken);state=result.state;}}
async function answer(value){state=await call('answer',{sessionToken,revision:state.revision,fieldId:state.question.id,value});}
el('form').addEventListener('submit',e=>{e.preventDefault();if(!state||state.complete)return;const value=el('answer').value;void run(()=>answer(state.question.type==='number'&&value!==''?Number(value):value));});el('skip').onclick=()=>void run(()=>answer(null));el('retry').onclick=()=>void run(load);el('restart').onclick=()=>{storageWrite('');state=null;sessionToken='';void run(load);};el('form').hidden=true;void run(load);
</script></body></html>
